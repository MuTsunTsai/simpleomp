<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{{TITLE}}</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<link rel="stylesheet" href="../assets/style.css">
	<link rel="stylesheet" href="../assets/demo.css">
	<script>
		const sabAvailable = typeof SharedArrayBuffer !== "undefined";
		if('serviceWorker' in navigator && location.hostname != "localhost") {
			navigator.serviceWorker.register("../sw.js");
			if(!sabAvailable) {
				const reloader = () => location.replace(location.href);
				setTimeout(() => navigator.serviceWorker.ready.then(reloader), 1000);
			}
		}
	</script>
</head>

<body class="p-3 p-md-5">
	<div class="container p-4 p-md-5">
		<div id="init" class="d-none">
			Initializing... <span class="loader"></span>
		</div>

		<div id="main" class="d-none">
			<a href="../index.html" class="btn btn-outline-primary mb-3">
				<span aria-hidden="true">← </span>Back to Examples
			</a>

			<h1 class="text-center mb-4">{{TITLE}}</h1>

			<div class="text-center mb-4">
				<span class="badge bg-primary fs-6 px-3 py-2" id="status">
					<span class="loader" id="spinner"></span>
					<span id="status-text">Initializing...</span>
				</span>
			</div>

			<div class="text-center mb-4">
				<div class="progress" style="height: 20px; display: none;" id="progress-container">
					<div class="progress-bar progress-bar-striped progress-bar-animated"
						 role="progressbar"
						 id="progress"
						 style="width: 0%"
						 aria-valuenow="0"
						 aria-valuemin="0"
						 aria-valuemax="100"></div>
				</div>
			</div>

			<div class="mt-4">
				<h2 class="h5 mb-3">Program Output:</h2>
				<div class="output-box border rounded p-3" id="output">
					<span class="loader" id="output-spinner"></span>
				</div>
			</div>

			<div id="sc-section" class="d-none mt-4">
				<h2 class="h5 mb-3">Source Code:</h2>
				<div id="code" class="d-block"></div>
			</div>

			<div class="mt-4 pt-3 border-top text-center text-secondary">
				<p class="mb-0">
					Built with SimpleOMP |
					<a href="https://github.com/MuTsunTsai/simpleomp" target="_blank" class="text-primary text-decoration-none">Learn More</a>
				</p>
			</div>
		</div>

	</div>

	<script type="module">
		import { codeToHtml } from 'https://esm.sh/shiki@3.15.0';
		const code = document.getElementById('code');
		code.innerHTML = await codeToHtml("{{CODE}}", {
			lang: 'cpp',
			theme: 'dark-plus'
		});
		document.getElementById("sc-section").classList.remove("d-none");
	</script>
	<script>
		// Display proper content
		const divToShow = sabAvailable ? "main" : "init";
		const div = document.getElementById(divToShow);
		div.classList.remove("d-none");

		var statusElement = document.getElementById('status-text');
		var statusContainer = document.getElementById('status');
		var progressBar = document.getElementById('progress');
		var progressContainer = document.getElementById('progress-container');
		var spinnerElement = document.getElementById('spinner');
		var outputElement = document.getElementById('output');
		var outputSpinner = document.getElementById("output-spinner");

		function addLine(text, color) {
			if(outputElement) {
				const div = document.createElement("div");
				if(color) div.style.color = color;
				if(text) div.innerText = text;
				else div.appendChild(document.createElement("br"));
				outputElement.insertBefore(div, outputSpinner);
				outputElement.scrollTop = outputElement.scrollHeight;
			}
		}

		var Module = {
			print(...args) {
				console.log(...args);
				addLine(args.join(' '));
			},
			printErr(...args) {
				console.error(...args);
				addLine(args.join(' '), "red");
			},
			onCustomMessage() {
				outputSpinner.style.display = "none";
			},
			canvas: document.createElement("canvas"),
			setStatus(text) {
				if(!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
				if(text === Module.setStatus.last.text) return;
				var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
				var now = Date.now();
				if(m && now - Module.setStatus.last.time < 30) return; // if this is a progress update, skip it if too soon
				Module.setStatus.last.time = now;
				Module.setStatus.last.text = text;
				if(m) {
					text = m[1];
					const percent = (parseInt(m[2]) / parseInt(m[4])) * 100;
					progressBar.style.width = percent + '%';
					progressBar.setAttribute('aria-valuenow', percent);
					progressContainer.style.display = 'block';
					spinnerElement.style.display = 'inline-block';
				} else {
					progressContainer.style.display = 'none';
					if(!text) {
						spinnerElement.style.display = 'none';
						statusContainer.classList.add('d-none');
					}
				}
				statusElement.innerHTML = text;
			},
			totalDependencies: 0,
			monitorRunDependencies(left) {
				this.totalDependencies = Math.max(this.totalDependencies, left);
				Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
			}
		};

		Module.setStatus('Loading...');

		window.onerror = () => {
			Module.setStatus('Exception thrown, see JavaScript console');
			spinnerElement.style.display = 'none';
			Module.setStatus = (text) => {
				if(text) console.error('[post-exception status] ' + text);
			};
		};
	</script>
	{{{ SCRIPT }}}
</body>

</html>
