name: Build and Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Verify Emscripten installation
        run: |
          emcc --version
          em++ --version

      - name: Build library
        run: make

      - name: Verify build output
        run: |
          ls -lh dist/
          file dist/libsimpleomp.a

      - name: Extract version from tag
        id: version
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Extract the section for this version from CHANGELOG.md
          CHANGELOG=$(awk '/^## \['$VERSION'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md)

          # If changelog is empty, use a default message
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/CHANGELOG.md) for details."
          fi

          # Save to output using heredoc to handle multiline content
          {
            echo 'content<<EOF'
            echo "$CHANGELOG"
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ${{ steps.changelog.outputs.content }}

            ---

            **Build Date:** ${{ steps.version.outputs.date }}
            **Commit:** ${{ github.sha }}

            ## Installation

            Download `libsimpleomp.a` and link it when building your Emscripten project:

            ```bash
            emcc your_code.c -fopenmp -pthread \
              -sPTHREAD_POOL_SIZE=navigator.hardwareConcurrency \
              libsimpleomp.a -o output.js
            ```

            Optionally, download `omp.h` to use the OpenMP Runtime API:

            ```bash
            emcc your_code.c -I/path/to/include -fopenmp -pthread \
              -sPTHREAD_POOL_SIZE=navigator.hardwareConcurrency \
              libsimpleomp.a -o output.js
            ```

            **⚠️ IMPORTANT:** You **MUST** include the `-sPTHREAD_POOL_SIZE=navigator.hardwareConcurrency` flag. See the [README](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/README.md) for more details.
          files: |
            dist/libsimpleomp.a
            include/omp.h
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
